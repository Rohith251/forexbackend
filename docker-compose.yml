services:
  backend_app:
    container_name: backend_app1
    build: .
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}  # Set via Jenkins or locally
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "8081:8081"
    networks:
      - app_network

networks:
  app_network:
